<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Nation - Taste the Happiness 🍴</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(120deg, #ff9a9e, #fad0c4);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .logo {
            text-align: center;
            font-size: 2.4em;
            font-weight: bold;
            color: #e91e63;
        }

        .tagline {
            text-align: center;
            color: #555;
            font-size: 1.1em;
        }

        .menu-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .section-title {
            text-align: center;
            color: #e91e63;
            font-size: 2em;
            margin-bottom: 15px;
        }

        .category-buttons {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .category-btn {
            background: linear-gradient(45deg, #ff6f61, #ff9a9e);
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .category-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 112, 67, 0.3);
        }

        .category-btn.active {
            background: linear-gradient(45deg, #ff9a9e, #ff6f61);
        }

        .food-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 15px;
        }

        .food-item {
            background: #fff;
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .food-item:hover {
            transform: translateY(-5px);
            border: 2px solid #ff6f61;
        }

        .food-item img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .food-item h3 {
            color: #e91e63;
        }

        .food-description {
            font-size: 0.9em;
            color: #666;
            margin-bottom: 10px;
        }

        .food-details {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .price {
            font-weight: bold;
            color: #ff6f61;
            font-size: 1.1em;
        }

        .delivery-time {
            background: #ff6f61;
            color: white;
            padding: 4px 8px;
            border-radius: 10px;
            font-size: 0.8em;
        }

        .add-btn {
            width: 100%;
            padding: 10px;
            background: linear-gradient(45deg, #ff6f61, #ff9a9e);
            border: none;
            color: white;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
        }

        .add-btn:hover {
            opacity: 0.9;
        }

        .cart {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        .cart-title {
            text-align: center;
            color: #ff6f61;
            font-size: 1.4em;
            margin-bottom: 10px;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .quantity-btn,
        .remove-btn {
            background: #eee;
            border: none;
            border-radius: 50%;
            width: 26px;
            height: 26px;
            cursor: pointer;
            font-weight: bold;
        }

        .remove-btn {
            color: #d32f2f;
        }

        .cart-total {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
            color: #ff6f61;
        }

        .checkout-btn {
            width: 100%;
            margin-top: 15px;
            background: linear-gradient(45deg, #ff9a9e, #ff6f61);
            border: none;
            color: white;
            font-weight: bold;
            padding: 12px 0;
            border-radius: 25px;
            cursor: pointer;
        }

        .checkout-btn:hover {
            transform: translateY(-2px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 25px;
            max-width: 400px;
            width: 90%;
            position: relative;
            text-align: center;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 18px;
            cursor: pointer;
        }

        .pay-btn {
            width: 100%;
            margin-top: 10px;
            background: #ff6f61;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .pay-btn:hover {
            background: #e91e63;
        }

        #authSection {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 8px;
            z-index: 2000;
        }

        #authSection button {
            padding: 8px 18px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            color: white;
        }

        #loginBtn {
            background: #ff6f61;
        }

        #logoutBtn {
            background: #e91e63;
            display: none;
        }

        #historyBtn {
            background: #ff9a9e;
            display: none;
        }

        #notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #333;
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            display: none;
            z-index: 3000;
        }

        .history-order {
            border: 1px solid #ddd;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            text-align: left;
        }

        .history-order h4 {
            color: #e91e63;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">🍛 Food Nation</div>
            <div class="tagline">Taste the Happiness — Hot, Fresh & Delivered Fast!</div>
        </header>

        <div class="menu-section">
            <h2 class="section-title">Our Menu</h2>
            <div class="category-buttons">
                <button class="category-btn active" onclick="showCategory('all')">All</button>
                <button class="category-btn" onclick="showCategory('biryani')">Biryani</button>
                <button class="category-btn" onclick="showCategory('pizza')">Pizza</button>
                <button class="category-btn" onclick="showCategory('burger')">Burgers</button>
                <button class="category-btn" onclick="showCategory('cooldrink')">Cool Drinks</button>
                <button class="category-btn" onclick="showCategory('tiffin')">Tiffins</button>
                <button class="category-btn" onclick="showCategory('dessert')">Desserts</button>
            </div>
            <div class="food-grid" id="foodGrid"></div>
        </div>

        <div class="cart">
            <h3 class="cart-title">🛒 Your Cart</h3>
            <div id="cartItems" class="empty-cart">Your cart is empty</div>
            <div id="cartTotal" class="cart-total" style="display:none;"></div>
            <button class="checkout-btn" id="checkoutBtn" onclick="openPaymentModal()" style="display:none;">Proceed to
                Pay</button>
        </div>
    </div>

    <!-- PAYMENT MODAL -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('paymentModal')">&times;</span>
            <h3>💳 Choose Payment Method</h3>
            <label><input type="radio" name="payment" value="UPI"> UPI</label><br>
            <label><input type="radio" name="payment" value="Card"> Credit / Debit Card</label><br>
            <label><input type="radio" name="payment" value="COD"> Cash on Delivery</label><br>
            <button class="pay-btn" onclick="pay()">Pay Now</button>
        </div>
    </div>

    <!-- LOGIN MODAL -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('loginModal')">&times;</span>
            <h3>Login to Continue</h3>
            <input type="email" id="email" placeholder="Enter email"><br>
            <input type="password" id="pass" placeholder="Enter password"><br>
            <button class="pay-btn" onclick="login()">Login</button>
        </div>
    </div>

    <!-- HISTORY MODAL -->
    <div class="modal" id="historyModal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('historyModal')">&times;</span>
            <h3>📜 Order History</h3>
            <div id="historyList"></div>
        </div>
    </div>

    <div id="authSection">
        <button id="loginBtn">Login</button>
        <button id="historyBtn">History</button>
        <button id="logoutBtn">Logout</button>
    </div>
    <div id="notification"></div>

    <script>
        class MenuItem {
            constructor(type, name, desc, price, time, img) {
                this.type = type; this.name = name; this.desc = desc; this.price = price; this.time = time; this.img = img;
            }
            getHTML() {
                return `<div class="food-item" data-cat="${this.type}">
<img src="${this.img}">
<h3>${this.name}</h3>
<p class="food-description">${this.desc}</p>
<div class="food-details"><span class="price">₹${this.price}</span><span class="delivery-time">${this.time} min</span></div>
<button class="add-btn" onclick="addToCart('${this.name}',${this.price})">Add to Cart</button></div>`;
            }

        let cart = [], history = [], logged = false;
        function displayMenu(items) { document.getElementById('foodGrid').innerHTML = items.map(i => i.getHTML()).join(''); }
        displayMenu(menu);
        function showCategory(cat) { document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); displayMenu(cat === 'all' ? menu : menu.filter(i => i.type === cat)); }
        function addToCart(name, price) { const item = cart.find(x => x.name === name); if (item) item.qty++; else cart.push({ name, price, qty: 1 }); updateCart(); }
        function updateCart() { const el = document.getElementById('cartItems'); const totalEl = document.getElementById('cartTotal'); const btn = document.getElementById('checkoutBtn'); if (cart.length === 0) { el.innerHTML = '<div class="empty-cart">Your cart is empty</div>'; totalEl.style.display = 'none'; btn.style.display = 'none'; } else { el.innerHTML = cart.map(i => `<div class="cart-item"><div><span>${i.name}</span><br>₹${i.price * i.qty}</div><div class="quantity-controls"><button class="quantity-btn" onclick="changeQty('${i.name}',-1)">-</button>${i.qty}<button class="quantity-btn" onclick="changeQty('${i.name}',1)">+</button></div><button class="remove-btn" onclick="removeItem('${i.name}')">x</button></div>`).join(''); const total = cart.reduce((s, i) => s + i.price * i.qty, 0); totalEl.textContent = 'Total: ₹' + total; totalEl.style.display = 'block'; btn.style.display = 'block'; } }
        function changeQty(name, v) { const i = cart.find(x => x.name === name); if (i) { i.qty += v; if (i.qty <= 0) cart = cart.filter(x => x.name !== name); } updateCart(); }
        function removeItem(name) { cart = cart.filter(i => i.name !== name); updateCart(); }
        function openModal(id) { document.getElementById(id).style.display = 'flex'; }
        function closeModal(id) { document.getElementById(id).style.display = 'none'; }
        function openPaymentModal() { if (!logged) { notify('⚠️ Please login first'); return; } openModal('paymentModal'); }
        function pay() { const m = document.querySelector('input[name="payment"]:checked'); if (!m) { alert('Select payment method'); return; } const total = cart.reduce((s, i) => s + i.price * i.qty, 0); history.push({ time: new Date().toLocaleString(), total, items: [...cart] }); cart = []; updateCart(); closeModal('paymentModal'); notify('✅ Payment via ' + m.value + ' successful!'); }
        function login() { const e = document.getElementById('email').value, p = document.getElementById('pass').value; if (e && p.includes('@')) { logged = true; notify('✅ Logged in'); closeModal('loginModal'); document.getElementById('loginBtn').style.display = 'none'; document.getElementById('logoutBtn').style.display = 'inline-block'; document.getElementById('historyBtn').style.display = 'inline-block'; } else alert('Enter valid email'); }
        function openHistory() { const c = document.getElementById('historyList'); if (history.length === 0) c.innerHTML = '<p>No past orders</p>'; else c.innerHTML = history.map(h => `<div class="history-order"><h4>${h.time}</h4><ul>${h.items.map(i => `<li>${i.name} x${i.qty}</li>`).join('')}</ul><p><b>Total:</b> ₹${h.total}</p></div>`).reverse().join(''); openModal('historyModal'); }
        function logout() { logged = false; document.getElementById('loginBtn').style.display = 'inline-block'; document.getElementById('logoutBtn').style.display = 'none'; document.getElementById('historyBtn').style.display = 'none'; notify('👋 Logged out'); }
        function notify(msg) { const n = document.getElementById('notification'); n.textContent = msg; n.style.display = 'block'; setTimeout(() => n.style.display = 'none', 2500); }
        document.getElementById('loginBtn').onclick = () => openModal('loginModal');
        document.getElementById('logoutBtn').onclick = logout;
        document.getElementById('historyBtn').onclick = openHistory;
    </script>
</body>

</html>
